; Khung dự án ESP32 DevKit V1 (firmware chính). ESP32-CAM của P9 nằm riêng ở firmware-cam/.
[platformio]
default_envs = esp32dev

[env]
; Ghim core Arduino 2.0.x (espressif32@6.5.0 = core 2.0.14). Core 3.x đổi cách gọi PWM (ledc) và watchdog.
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Isrc/common
    -Isrc/p1_sensor
    -Isrc/p2_net
    -Isrc/p7_alert
    -Isrc/p9_scenario
; P2 dùng hai thư viện này cho MQTT/JSON. P2 chốt phiên bản ArduinoJson (6 hay 7) rồi sửa dòng dưới.
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

[env:esp32dev]

; Bản debug: chỉ để nhóm A kiểm phao (P7). KHÔNG nạp lúc đóng băng M4 / nghiệm thu.
[env:debug]
build_flags =
    ${env.build_flags}
    -DFW_DEBUG
